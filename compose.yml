services:
  floci:
    image: floci/floci:1.7.0-compat
    env_file:
      - ./config/aws.env
      - ./config/floci.env
    volumes:
      - ./scripts/floci/ready.d:/etc/floci/init/ready.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "curl --fail --silent http://localhost:4566/_floci/init | grep -q '\"ready\":true'"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 20s
    ports:
      - "4566:4566"

  # Initialise a Mongo cluster with a replicaset of 1 node.
  # Based on https://medium.com/workleap/the-only-local-mongodb-replica-set-with-docker-compose-guide-youll-ever-need-2f0b74dd8384
  # Since we are using transactions, we require a replicaset. Local dev with docker compose uses 1 node below, but our live
  # environments have multiple nodes.
  # The replicaset needs initialising, so the healthcheck can be hijacked to initialise this so that it can keep retrying
  # until the operation is successful (might need to wait a while after container boot for this to work, hence the interval/retries)
  # WARNING: do not turn on authentication, otherwise will need to deal with generating key pairs and sharing them between
  # the replicaset nodes. For local development this is overkill, so just turn off auth and connect to Mongo without creds.
  mongodb:
    image: mongo:6.0.28
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: echo "try { rs_status() } catch (err) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}) }" | mongosh --port 27017 --quiet
      interval: 5s
      timeout: 30s
      retries: 30
      start_period: 5s
    restart:
      always
    ports:
      - "27017:27017"

  mssql:
    image: mcr.microsoft.com/azure-sql-edge:latest
    env_file:
      - ./config/mssql.env
    healthcheck:
      interval: 5s
      retries: 10
      start_period: 5s
      test: timeout 1 bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/1433'
      timeout: 5s

  redis:
    image: redis:7.2.3-alpine3.18
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      start_period: 5s
      retries: 3
    ports:
      - "6379:6379"

  servicebus-emulator:
    image: servicebus-emulator-with-curl:latest
    build:
      dockerfile_inline: |
        FROM mcr.microsoft.com/dotnet/aspnet:8.0.3-cbl-mariner2.0-amd64 AS base
        FROM mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
        COPY --from=base /usr/bin/curl /usr/bin/curl
        COPY --from=base /usr/lib /usr/lib
        COPY --from=base /bin/sh /bin/sh
    env_file:
      - ./config/servicebus-emulator.env
    volumes:
      - ./config/servicebus-emulator.json:/ServiceBus_Emulator/ConfigFiles/Config.json
    depends_on:
      mssql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5300/health"]
      interval: 10s
      start_period: 5s
      retries: 3
    ports:
      - "5672:5672"
      - "5300:5300"

  btms-gateway:
    image: defradigital/btms-gateway:${BTMS_GATEWAY:-latest}
    env_file:
      - ./config/aws.env
      - ./config/btms-gateway.env
    depends_on:
      floci:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      trade-imports-cds-simulator-api:
        condition: service_healthy
      trade-imports-data-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "http://localhost:8080/health"]
      interval: 3s
      start_period: 2s
      retries: 3
    ports:
      - "8080:8080"

  btms-portal-frontend:
    image: defradigital/btms-portal-frontend:${BTMS_PORTAL_FRONTEND:-latest}
    env_file:
      - ./config/btms-portal-frontend.env
    depends_on:
      redis:
        condition: service_healthy
      btms-gateway:
        condition: service_healthy
      cdp-defra-id-stub:
        condition: service_healthy
      trade-imports-data-api:
        condition: service_healthy
      trade-imports-decision-deriver:
        condition: service_healthy
      trade-imports-processor:
        condition: service_healthy
      trade-imports-reporting-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "http://localhost:3000/health"]
      interval: 3s
      start_period: 2s
      retries: 3
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000"
      - "9229:9229"

  cdp-defra-id-stub:
    image: defradigital/cdp-defra-id-stub:${CDP_DEFRA_ID_STUB:-latest}
    env_file:
      - ./config/aws.env
      - ./config/cdp-defra-id-stub.env
    depends_on:
      floci:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "http://localhost:3200/health"]
      interval: 3s
      start_period: 2s
      retries: 3
    ports:
      - "3200:3200"
    networks:
      default:
        aliases:
          - cdp-defra-id-stub.localhost

  trade-imports-cds-simulator-api:
    image: defradigital/trade-imports-cds-simulator-api:${TRADE_IMPORTS_CDS_SIMULATOR_API:-latest}
    env_file:
      - ./config/aws.env
      - ./config/trade-imports-cds-simulator-api.env
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "http://localhost:8080/health"]
      interval: 3s
      start_period: 2s
      retries: 3
    ports:
      - "5003:8080"

  trade-imports-data-api:
    image: defradigital/trade-imports-data-api:${TRADE_IMPORTS_DATA_API:-latest}
    env_file:
      - ./config/aws.env
      - ./config/trade-imports-data-api.env
    depends_on:
      floci:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "http://localhost:8080/health"]
      interval: 3s
      start_period: 2s
      retries: 3
    ports:
      - "8081:8080"

  trade-imports-decision-deriver:
    image: defradigital/trade-imports-decision-deriver:${TRADE_IMPORTS_DECISION_DERIVER:-latest}
    env_file:
      - ./config/aws.env
      - ./config/trade-imports-decision-deriver.env
    depends_on:
      floci:
        condition: service_healthy
      trade-imports-data-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "http://localhost:8080/health"]
      interval: 3s
      start_period: 2s
      retries: 3
    ports:
      - "8083:8080"

  trade-imports-processor:
    image: defradigital/trade-imports-processor:${TRADE_IMPORTS_PROCESSOR:-latest}
    env_file:
      - ./config/aws.env
      - ./config/trade-imports-processor.env
    depends_on:
      floci:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      servicebus-emulator:
        condition: service_healthy
      trade-imports-data-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "http://localhost:8080/health"]
      interval: 3s
      start_period: 2s
      retries: 3
    ports:
      - "8082:8080"

  trade-imports-reporting-api:
    image: defradigital/trade-imports-reporting-api:${TRADE_IMPORTS_REPORTING_API:-latest}
    env_file:
      - ./config/aws.env
      - ./config/trade-imports-reporting-api.env
    depends_on:
      floci:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      trade-imports-data-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "http://localhost:8080/health"]
      interval: 3s
      start_period: 2s
      retries: 3
    ports:
      - "8085:8080"

volumes:
  mongodb-data:
